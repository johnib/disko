[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "disko"
dynamic = ["version"]
description = "Interactive disk usage explorer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Barazany" }]
keywords = ["disk", "usage", "filesystem", "visualization", "treemap", "storage", "du"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/johnib/disko"
Issues = "https://github.com/johnib/disko/issues"

[project.scripts]
disko = "disko:main"

[tool.setuptools]
py-modules = ["disko"]

[tool.setuptools.dynamic]
version = { attr = "disko.__version__" }
